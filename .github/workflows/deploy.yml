name: Redirect GitHub Pages to beathagenlocher.com/talks/

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The decks are built and served at beathagenlocher.com/talks/ (Flow builds this repo);
      # GitHub Pages only sends every old address there, path and all (404.html answers
      # every path it has no file for).
      - name: Redirects to beathagenlocher.com/talks/
        run: |
          mkdir -p dist
          cp redirect.html dist/index.html
          cp redirect.html dist/404.html

      - name: Setup Pages
        if: ${{ !env.ACT }}
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: ${{ !env.ACT }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        if: ${{ !env.ACT }}
        id: deployment
        uses: actions/deploy-pages@v4

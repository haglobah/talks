name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup @antfu/ni
        run: npm i -g @antfu/ni

      - name: Setup yoarhe template
        run: |
          cd "./yoarhe"
          nci

      - name: Install dependencies & build
        run: |
          mkdir -p ./dist
          pwd
          for dir in ./talks/*/; do
            if [ -f "$dir/package.json" ]; then
              talk_path=${dir%*/}        # Remove trailing slash
              talk_name=${talk_path##*/} # Extract folder name
              echo "Building $talk_name"
              cd "$dir"
              echo "Current directory: $(pwd)"
              echo "Contents of current directory:"
              ls -la
              nci
              echo "Contents after nci:"
              ls -la
              echo "Running build command..."
              nr build --base "/${{ github.event.repository.name }}/$talk_name/" --out "../dist/$talk_name" # -> https://sli.dev/guide/hosting
              echo "Build complete. Contents of ../dist/$talk_name:"
              ls -la ../dist/$talk_name
              pwd
              cd ..
              pwd
            fi
          done

      - name: List contents of dist directory
        run: |
          echo "Contents of ./dist:"
          ls -R ./dist

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

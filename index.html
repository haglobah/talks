<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talks</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
      background: #f5f5f5;
    }
    h1 {
      color: #333;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      margin: 1rem 0;
    }
    a {
      display: inline-block;
      padding: 0.5rem 1rem;
      background: #0066cc;
      color: white;
      text-decoration: none;
      border-radius: 4px;
    }
    a:hover {
      background: #0052a3;
    }
  </style>
</head>
<body>
  <h1>Talks</h1>
  <ul id="talks-list"></ul>

  <script>
    const talksContainer = document.getElementById('talks-list')
    fetch('./talks.json')
      .then(response => response.json())
      .then(talks => {
        talks.forEach(talk => {
          const li = document.createElement('li')
          const a = document.createElement('a')
          a.href = `./${talk}/`
          a.textContent = talk
          li.appendChild(a)
          talksContainer.appendChild(li)
        })
      })
  </script>
</body>
</html>
